<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClassMate · CampusEquipo</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1d2742;--mut:#667089;--line:#dde3ee;--acc:#14877b;--hi:#ffd23f;--bad:#d9482b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2e;--card:#1b2540;--ink:#eef2fb;--mut:#9aa6c2;--line:#2d3a5c;--bad:#ff7a5c}}
:root[data-theme="dark"]{--bg:#121a2e;--card:#1b2540;--ink:#eef2fb;--mut:#9aa6c2;--line:#2d3a5c;--bad:#ff7a5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45;padding-bottom:84px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;max-width:760px;margin:auto}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.logo span{background:linear-gradient(var(--hi),var(--hi)) no-repeat 0 90%;background-size:100% 45%;padding:0 3px}
.logo small{display:block;font-size:.7rem;font-weight:400;color:var(--mut);letter-spacing:0}
main{max-width:760px;margin:auto;padding:0 16px}
h2{margin:6px 0 12px;font-size:1.25rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.s{padding:5px 10px;font-size:.85rem}
.btn.d{color:var(--bad);background:transparent;border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:.88rem}
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);margin:2px 4px 2px 0}
.tag.h,.tag.jf{background:var(--hi);color:#1d2742;border-color:var(--hi);font-weight:600}
.tag.pr{background:#6a5acd;color:#fff;border-color:#6a5acd}
.tag.g{border-color:var(--acc);color:var(--acc)}.tag.b{border-color:var(--bad);color:var(--bad)}
.prog{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.task{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.task input{width:20px;height:20px;accent-color:var(--acc);flex:none;margin:0}
.task.done b{text-decoration:line-through;color:var(--mut)}
.task div{flex:1;min-width:0}
.late{color:var(--bad);font-weight:600}
.vote{display:flex;flex-direction:column;align-items:center;min-width:48px;border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px;cursor:pointer;font-weight:600;height:fit-content}
.vote.on{background:var(--hi);color:#1d2742;border-color:var(--hi)}
.note{display:flex;gap:12px}.note>div{flex:1;min-width:0}
.note img{max-width:100%;border-radius:10px;margin-top:8px;max-height:320px;object-fit:cover}
.note p{white-space:pre-wrap;margin:6px 0 0}
.av{width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.aviso{border-left:6px solid var(--acc)}.aviso.Suspensión{border-color:var(--bad)}.aviso.Evento{border-color:#6a5acd}.aviso.Beca{border-color:var(--hi)}
.empty{text-align:center;color:var(--mut);padding:28px 10px;border:2px dashed var(--line);border-radius:14px;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;max-width:190px;background:none;border:0;padding:10px 4px;cursor:pointer;color:var(--mut);font-size:.8rem;font-weight:600}
nav button span{display:block;font-size:1.4rem}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
input,select,textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);margin:4px 0 10px}
label{font-size:.88rem;font-weight:600}
.checks label{display:inline-flex;gap:5px;align-items:center;font-weight:400;margin:0 12px 6px 0}
.checks input{width:auto;margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g2 select{margin:0}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.sw1{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw1.on{border-color:var(--ink)}
dialog{border:0;border-radius:16px;padding:18px;width:min(460px,92vw);background:var(--card);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(10,15,30,.55)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;max-width:90vw}
#toast.on{opacity:1}
#cf{position:fixed;inset:0;pointer-events:none;z-index:20}
#app.enter .card,#app.enter .empty{animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
body.noanim *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:480px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo"><span>ClassMate</span><small>CampusEquipo · tu prepa, organizada</small></div>
  <div class="bar" style="margin:0"><button class="btn g s" data-a="theme" aria-label="Personalizar">🎨</button><button class="btn g s" data-a="profile" id="me">…</button><button class="btn g s" data-a="logout" id="lo" hidden>Salir</button></div>
</header>
<main id="app"><div class="empty">Conectando…</div></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<canvas id="cf"></canvas>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MAT=['Matemáticas','Programación','Física','Química','Biología','Historia','Inglés','Español','Contabilidad','Dibujo técnico'];
const SEM=['1° semestre','2° semestre','3° semestre','4° semestre','5° semestre','6° semestre'],GRP=['A','B','C','D','E','F'];
const COLS=['#14877b','#6c4ad8','#e0553a','#2563eb','#d6336c','#4d8a1f','#c76a00'];
const ROL={alumno:'Alumno',jefe:'Jefe de grupo',profesor:'Profesor'};
const iso=d=>d.toISOString().slice(0,10),day=n=>iso(new Date(Date.now()+n*864e5));
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'}):'';
let ME,ADM=false,db,UI={color:COLS[0],mode:'auto',anim:true};
try{Object.assign(UI,JSON.parse(localStorage.getItem('cm_ui')))}catch(e){}
const D={people:{},roles:{},projects:[],notes:[],posts:[]},V={tab:'p',nm:'',cq:'',cm:'',cs:'',cr:'',bt:'of'};
let PIN=null,OK=false,AUTH=false,AT='in';
const hp=async(s,salt)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const pinDoc=()=>db.doc('data/users/'+ME+'/pin');
const nm=id=>(D.people[id]?.name||'Alguien')+(String(id).startsWith('bot_')?' 🤖':''),MP=()=>D.people[ME]||{},R=()=>ADM?'profesor':D.roles[ME]||'alumno';
const priv=()=>R()!=='alumno',prof=()=>R()==='profesor';
const canMod=a=>prof()||(R()==='jefe'&&(a.para||'').startsWith(MP().sem||'~'));
const rolOf=id=>D.roles[id]||'alumno';
const col=c=>db.collection(c),ref=(c,id)=>db.doc(c+'/'+id);
const uid=()=>Math.random().toString(36).slice(2,9);
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
const wr=(p,m)=>p.then(()=>m&&toast(m)).catch(e=>toast(e?.code==='not_granted'?'No tienes permiso para editar':'No se pudo guardar'));
const sel=(id,arr,cur,all)=>`<select id="${id}"><option value="">${all}</option>${arr.map(x=>`<option${x===cur?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
const tg=(a,c)=>(a||[]).map(x=>`<span class="tag ${c||''}">${esc(x)}</span>`).join('');
const empty=t=>`<div class="empty">${t}</div>`;
function theme(){const r=document.documentElement;r.style.setProperty('--acc',UI.color);UI.mode==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',UI.mode);document.body.classList.toggle('noanim',!UI.anim);try{localStorage.setItem('cm_ui',JSON.stringify(UI))}catch(e){}}
function boom(){if(!UI.anim||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=$('#cf'),x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,cs=[UI.color,'#ffd23f','#ff6b6b','#4dabf7','#9775fa'];
const ps=Array.from({length:90},()=>({x:W/2,y:H*.6,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,s:5+Math.random()*6,c:cs[Math.random()*5|0],r:Math.random()*6}));let n=0;
(function f(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});if(++n<110)requestAnimationFrame(f);else x.clearRect(0,0,W,H)})()}

/* ---------- Formularios ---------- */
function form(title,fields,ok,btn='Guardar'){
  const d=$('#dlg');if(d.open)d.close();
  const ov=o=>Array.isArray(o)?o:[o,o];
  d.innerHTML=`<form method="dialog" id="f"><h2>${esc(title)}</h2>${fields.map(f=>{
    const v=f.v??'',id='f_'+f.k,L=`<label for="${id}">${esc(f.l)}</label>`;
    if(f.t==='select')return L+`<select id="${id}">${f.o.map(o=>{const[a,b]=ov(o);return`<option value="${esc(a)}"${a===v?' selected':''}>${esc(b)}</option>`}).join('')}</select>`;
    if(f.t==='area')return L+`<textarea id="${id}" rows="5" ${f.r?'required':''}>${esc(v)}</textarea>`;
    if(f.t==='checks')return `<label>${esc(f.l)}</label><div class="checks" id="${id}">${f.o.map(o=>`<label><input type="checkbox" value="${esc(o)}"${(v||[]).includes(o)?' checked':''}>${esc(o)}</label>`).join('')}</div>`;
    if(f.t==='file')return L+`<input type="file" id="${id}" accept="image/*">`;
    return L+`<input id="${id}" type="${f.t||'text'}" value="${esc(v)}" maxlength="${f.t==='date'?20:200}" ${f.r?'required':''} ${f.min?`min="${f.min}"`:''}>`}).join('')}
  <div class="bar" style="justify-content:flex-end;margin:6px 0 0"><button type="button" class="btn g" id="x">Cancelar</button><button class="btn">${btn}</button></div></form>`;
  $('#x').onclick=()=>d.close();
  $('#f').onsubmit=async e=>{e.preventDefault();const o={};
    for(const f of fields){const el=$('#f_'+f.k);
      if(f.t==='checks')o[f.k]=[...el.querySelectorAll('input:checked')].map(i=>i.value);
      else if(f.t==='file')o[f.k]=el.files[0]?await shrink(el.files[0]):'';
      else o[f.k]=el.value.trim()}
    if(ok(o)!==false)d.close()};
  d.showModal();
}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};im.onerror=()=>res('');im.src=r.result};r.onerror=()=>res('');r.readAsDataURL(file)})}

/* ---------- Vistas ---------- */
const P=id=>D.projects.find(p=>p.id===id);
const mine=p=>p.members.includes(ME)||prof();
function pc(p){
  const n=p.tasks.length,dn=p.tasks.filter(t=>t.done).length,v=n?Math.round(dn/n*100):0,adm=p.by===ME||priv();
  return `<div class="card"><div class="row"><div><b style="font-size:1.1rem">${esc(p.name)}</b>${p.open?' <span class="tag">Abierto</span>':''}<div class="mut">${esc(p.materia)}${p.due?' · entrega '+fd(p.due):''} · creado por ${esc(nm(p.by))}</div></div>
  ${adm?`<button class="btn d s" data-a="p-del" data-id="${p.id}">Eliminar</button>`:''}</div>
  <div class="prog" role="progressbar" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><i style="width:${v}%"></i></div>
  <div class="mut">Avance: <b>${v}%</b> (${dn} de ${n} tareas)${v===100&&n?' 🎉 ¡Equipo completo!':''}</div>
  <div style="margin:8px 0">${p.members.map(m=>{const mt=p.tasks.filter(t=>t.who===m);return `<span class="tag${mt.length&&mt.every(t=>t.done)?' h':''}">${esc(nm(m))} ${mt.filter(t=>t.done).length}/${mt.length}${adm||m===ME?`<button class="btn d s" style="border:0;padding:0 0 0 6px" data-a="m-del" data-id="${p.id}" data-x="${m}" aria-label="Quitar a ${esc(nm(m))}">×</button>`:''}</span>`}).join('')}
  <button class="btn g s" data-a="m-add" data-id="${p.id}">+ Integrante</button></div>
  ${p.tasks.map(t=>`<div class="task${t.done?' done':''}"><input type="checkbox" ${t.done?'checked':''} data-a="t-tog" data-id="${p.id}" data-x="${t.id}" aria-label="Marcar tarea"><div><b>${esc(t.title)}</b><div class="mut">${esc(nm(t.who))}${t.due?` · <span class="${!t.done&&t.due<day(0)?'late':''}">${!t.done&&t.due<day(0)?'Vencida ':''}${fd(t.due)}</span>`:''}</div></div><button class="btn d s" data-a="t-del" data-id="${p.id}" data-x="${t.id}" aria-label="Borrar tarea">×</button></div>`).join('')}
  <div style="margin-top:8px"><button class="btn s" data-a="t-new" data-id="${p.id}">+ Asignar tarea</button></div></div>`}
function vProjects(){
  const L=D.projects.filter(mine),O=D.projects.filter(p=>p.open&&!mine(p));
  const late=D.projects.flatMap(p=>p.tasks).filter(t=>t.who===ME&&!t.done&&t.due&&t.due<day(0)).length,
        pend=D.projects.flatMap(p=>p.tasks).filter(t=>t.who===ME&&!t.done).length;
  return `<h2>Mis equipos</h2>${pend?`<div class="card mut">Tienes <b>${pend}</b> tarea${pend>1?'s':''} pendiente${pend>1?'s':''}${late?` · <span class="late">${late} vencida${late>1?'s':''}</span>`:''}.</div>`:''}<div class="bar"><button class="btn" data-a="p-new">+ Nuevo proyecto</button></div>`+
  (L.length?L.map(pc).join(''):empty('Aún no estás en ningún equipo. Crea uno o únete a uno abierto.'))+
  (O.length?`<h2>Equipos abiertos</h2>`+O.map(p=>`<div class="card row"><div><b>${esc(p.name)}</b><div class="mut">${esc(p.materia)} · ${p.members.length} integrantes${p.due?' · entrega '+fd(p.due):''}</div></div><button class="btn s" data-a="p-join" data-id="${p.id}">Unirme</button></div>`).join(''):'');
}
function noteList(){
  const L=D.notes.filter(n=>!V.nm||n.materia===V.nm).sort((a,b)=>b.v.length-a.v.length||b.at.localeCompare(a.at));
  return L.length?L.map(n=>{const on=n.v.includes(ME);return `<div class="card note"><button class="vote${on?' on':''}" data-a="n-vote" data-id="${n.id}" aria-label="Votar apunte">▲<span>${n.v.length}</span></button>
  <div><div class="row"><b>${esc(n.title)}</b>${n.ok?'<span class="tag pr">✓ Revisado por profesor</span>':n.v.length>=3?'<span class="tag h">Mejor apunte</span>':''}</div>
  <div class="mut"><span class="tag">${esc(n.materia)}</span>${esc(nm(n.by))} · ${fd(n.at)}</div><p>${esc(n.text)}</p>${n.img?`<img src="${esc(n.img)}" alt="Foto del apunte">`:''}
  <div class="bar" style="margin:8px 0 0">${prof()&&!n.ok?`<button class="btn g s" data-a="n-ok" data-id="${n.id}">Marcar como revisado</button>`:''}${n.by===ME||priv()?`<button class="btn d s" data-a="n-del" data-id="${n.id}">Borrar</button>`:''}</div></div></div>`}).join(''):empty('No hay apuntes en esta materia. Sube el primero.');
}
function vNotes(){return `<h2>Muro de apuntes</h2><div class="bar"><button class="btn" data-a="n-new">+ Subir apunte</button><div style="flex:1;min-width:150px">${sel('nm',MAT,V.nm,'Todas las materias').replace('<select','<select style="margin:0"')}</div></div><div id="nl">${noteList()}</div>`}
function peerList(){
  const q=V.cq.toLowerCase(),RM={'Alumnos':'alumno','Jefes de grupo':'jefe','Profesores':'profesor'};
  const L=Object.entries(D.people).filter(([id,p])=>(!V.cm||(p.bueno||[]).includes(V.cm)||(p.ayudo||[]).includes(V.cm))&&(!V.cs||p.sem===V.cs)&&(!V.cr||rolOf(id)===RM[V.cr])&&(!q||((p.name||'')+(p.bio||'')+(p.grupo||'')+(p.bueno||[]).join(' ')).toLowerCase().includes(q))&&id!==ME);
  return L.length?L.map(([id,p])=>{const r=rolOf(id);return `<div class="card row"><div style="display:flex;gap:12px;align-items:center;flex:1;min-width:210px"><div class="av">${esc((p.name||'?')[0].toUpperCase())}</div><div><b>${esc(p.name)}</b> <span class="tag ${r==='profesor'?'pr':r==='jefe'?'jf':''}">${ROL[r]}</span> <span class="mut">${p.sem?esc(p.sem)+' · '+esc(p.grupo):''}</span>
    ${p.bueno?.length?`<div class="mut">${r==='profesor'?'Imparte':'Bueno en'}: ${tg(p.bueno,'g')}</div>`:''}${p.ayudo?.length?`<div class="mut">Ayuda con: ${tg(p.ayudo)}</div>`:''}
  <div class="mut">${esc(p.bio)}</div></div></div>
  <div class="bar" style="margin:0"><button class="btn s" data-a="c-inv" data-id="${id}">${r==='profesor'?'Pedir asesoría':'Invitar a proyecto'}</button>${ADM?`<button class="btn g s" data-a="c-role" data-id="${id}">Cambiar rol</button>`:''}</div></div>`}).join(''):empty('Nadie coincide. Comparte el enlace con tus compañeros para que se registren.');
}
function vPeers(){const m=MP();return `<h2>Compañeros y profesores</h2><div class="card"><b>${esc(nm(ME))}</b> <span class="tag ${prof()?'pr':R()==='jefe'?'jf':''}">${ROL[R()]}</span> <span class="mut">${esc(m.sem||'')} · grupo ${esc(m.grupo||'')}</span>
${m.bueno?.length?`<div class="mut">Soy bueno en: ${tg(m.bueno,'g')}</div>`:''}${m.ayudo?.length?`<div class="mut">Puedo ayudar con: ${tg(m.ayudo)}</div>`:''}
<div class="bar" style="margin:8px 0 0"><button class="btn g s" data-a="profile">Editar perfil</button>${ADM&&Object.keys(D.people).some(i=>i.startsWith('bot_'))?'<button class="btn d s" data-a="demo-del">Quitar datos demo 🤖</button>':''}</div></div>
<input id="cq" placeholder="Buscar por nombre o tema" value="${esc(V.cq)}" style="margin:0 0 8px">
<div class="g2" style="margin-bottom:12px">${sel('cm',MAT,V.cm,'Cualquier materia')}${sel('cs',SEM,V.cs,'Cualquier semestre')}${sel('cr',['Alumnos','Jefes de grupo','Profesores'],V.cr,'Todos')}</div><div id="cl">${peerList()}</div>`}
function vBoard(){
  const co=V.bt==='co',L=D.posts.filter(a=>a.src===V.bt).sort((a,b)=>(!!b.pin-!!a.pin)||b.at.localeCompare(a.at));
  return `<h2>Tablero del plantel</h2><div class="bar"><button class="btn${co?' g':''}" data-a="bt" data-id="of">Oficiales</button><button class="btn${co?'':' g'}" data-a="bt" data-id="co">Noticias de alumnos</button></div>
  <div class="mut" style="margin-bottom:10px">${co?'Cualquier alumno puede compartir lo que escuchó. No son oficiales hasta que un jefe de grupo o profesor las confirme.':'Solo profesores y jefes de grupo publican aquí. '+(R()==='jefe'?'Tú publicas para tu semestre.':'')}</div>
  ${co||priv()?`<div class="bar"><button class="btn" data-a="${co?'co-new':'a-new'}">${co?'+ Compartir una noticia':'+ Publicar aviso oficial'}</button></div>`:''}

function render(){

function LocalDB(){
  const K='cm_localdb',L={};let S;
  try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
  if(!S)S=seedLocal();
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},fire=c=>(L[c]||[]).forEach(f=>f());
  const snap=c=>({docs:Object.entries(S[c]||{}).map(([id,d])=>({id,data:()=>JSON.parse(JSON.stringify(d))}))});
  const sp=p=>{const a=p.split('/');return[a[0],a.slice(1).join('/')]};
  const put=(c,id,d)=>{(S[c]=S[c]||{})[id]=JSON.parse(JSON.stringify(d));save();fire(c)};
  const dref=p=>{const[c,id]=sp(p);return{
    get:async()=>({exists:!!S[c]?.[id],data:()=>S[c]?.[id]}),
    set:async d=>put(c,id,d),
    update:async d=>put(c,id,{...(S[c]?.[id]||{}),...d}),
    delete:async()=>{if(S[c])delete S[c][id];save();fire(c)}}};
  return{doc:dref,collection:c=>({
    onSnapshot(n){(L[c]=L[c]||[]).push(()=>n(snap(c)));setTimeout(()=>n(snap(c)));return()=>{}},
    add:async d=>{const id=uid()+uid();put(c,id,d);return dref(c+'/'+id)}})}}
